openapi: 3.1.0
info:
  title: Probe Research & Verification Engine API
  version: 1.0.0
  description: Multi-source research discovery, query expansion, and product validation endpoints.
paths:
  /api/search:
    post:
      summary: Execute multi-source research retrieval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  example: "Why do developers abandon AI coding tools?"
                sources:
                  type: array
                  items:
                    type: string
                    enum: [reddit, x, linkedin, scholarxiv]
                limit:
                  type: integer
                  default: 20
      responses:
        '200':
          description: Ranked evidence sources
        '400':
          description: Invalid request parameters
  /api/health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service status
